# /etc/ssh/ssh_config.d/00-hardened.conf
# Global hardened SSH client defaults for all outgoing connections

Host *
    # Key Agent & Identity Management
    AddKeysToAgent yes
    IdentitiesOnly yes

    # Ciphers: Prefer AEAD ciphers (ChaCha20, AES-GCM), fallback to AES-CTR
    Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

    # Host Key Algorithms: Replaced deprecated SHA-1 (ssh-rsa) with rsa-sha2 variants and Ed25519
    HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256

    # Key Exchange: Elliptic Curve DH & static 4096-bit DH groups over dynamic exchange
    KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256

    # MACs: Strictly Encrypt-then-MAC (EtM) algorithms
    MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

    # Authentication
    PubkeyAuthentication yes

    # Keepalives (Sends a ping every 30s; allows 120 retries before timing out)
    # Total idle timeout window = 30s * 120 = 3600 seconds (1 hour)
    TCPKeepAlive yes
    ServerAliveInterval 30
    ServerAliveCountMax 120

# vim: set filetype=sshconfig :
