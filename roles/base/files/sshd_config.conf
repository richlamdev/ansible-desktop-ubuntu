# PASSWORD AUTHENTICATION TOGGLE
# Change both lines below to "yes" to enable password auth
KbdInteractiveAuthentication no
PasswordAuthentication no

Port 22
PermitRootLogin no
PermitUserEnvironment no
UseDNS no

Ciphers aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
HostKeyAlgorithms ssh-ed25519
KexAlgorithms curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com

AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
AddressFamily inet

HostBasedAuthentication no
GSSAPIAuthentication no
KerberosAuthentication no

HostKey /etc/ssh/ssh_host_ed25519_key

TCPKeepAlive yes
ClientAliveInterval 600
ClientAliveCountMax 5

X11Forwarding no

# Logging
SyslogFacility AUTHPRIV
LogLevel VERBOSE

PubkeyAuthentication yes

# Brute-force / connection throttling
MaxAuthTries 4
LoginGraceTime 30
MaxStartups 10:30:60

# Restrict which accounts may log in via SSH — replace with real usernames/groups
#AllowUsers alice bob
#AllowGroups sshusers

PermitEmptyPasswords no

# vim: set filetype=sshdconfig :
