# Change both lines below to "yes" to enable password auth during initial bootstrap.
# Once public keys are deployed to user accounts, change back to "no".
KbdInteractiveAuthentication no
PasswordAuthentication no

# Network & Protocol Settings
Port 22
AddressFamily inet
UseDNS no

# Authentication Configuration
PermitRootLogin no
PermitEmptyPasswords no
PubkeyAuthentication yes
HostBasedAuthentication no
GSSAPIAuthentication no
KerberosAuthentication no
PermitUserEnvironment no

# Host Keys
HostKey /etc/ssh/ssh_host_ed25519_key
# HostKey /etc/ssh/ssh_host_rsa_key  # Uncomment if supporting legacy clients with RSA

# Host Key Algorithms (Modern RSA signatures + Ed25519; excludes weak SHA-1 ssh-rsa)
HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Ciphers (AEADs first, CTR second)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# Key Exchange (Static ECC & fixed 4096-bit DH groups over dynamic exchange)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256

# MACs (Strictly Encrypt-then-MAC algorithms)
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# Forwarding & Tunneling Hardening
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no

# Connection Keepalives (Sends probe every 30s; allows up to 480 retries = 4 hours idle time)
TCPKeepAlive yes
ClientAliveInterval 30
ClientAliveCountMax 480

# Brute-force & Connection Throttling
MaxAuthTries 4
LoginGraceTime 30
MaxStartups 10:30:60

# Logging
SyslogFacility AUTHPRIV
LogLevel VERBOSE

# Restrict which accounts may log in via SSH — replace with real usernames/groups
#AllowUsers alice bob
#AllowGroups sshusers

# vim: set filetype=sshdconfig :
