---
fnm_version: "latest"
fnm_install_path: /usr/local/bin/fnm
fnm_repo: Schniz/fnm

# Where fnm keeps its node versions and aliases. This is fnm's own default on
# Linux; if you change it you must also export FNM_DIR in the shell, otherwise
# the `fnm env` hook in custom_bash.sh will not find these installs.
fnm_dir: "{{ home_dir }}/.local/share/fnm"

# Node versions to install for the local user. Empty by default: this role
# installs the version manager, not a runtime - same approach as the pyenv
# role in dev-tools. Per-project versions are handled by .node-version /
# .nvmrc and the `fnm env --use-on-cd` hook in custom_bash.sh.
#
# Pin versions explicitly, e.g. ['22'] or ['22.11.0', '20.18.0']. Moving
# aliases such as 'lts-latest' or 'latest' are not idempotent here: they
# resolve to a new release over time, so every playbook run would install
# yet another version.
fnm_node_versions: []

# Which of fnm_node_versions to alias as the default for new shells.
# Empty means the default alias is left alone.
fnm_node_default: ""

# Go toolchain, installed from the upstream tarballs at https://go.dev/dl/.
# "latest" tracks the newest stable release published there; pin an explicit
# version instead (e.g. "1.25.3") to hold a release.
go_version: "latest"

# Archives and their .sha256 files.  https://go.dev/dl/ redirects downloads
# here; the release index itself is read from go.dev (see go.yml).
go_dl_url: https://dl.google.com/go

# The tarball unpacks to a single `go` directory - /usr/local is the layout
# documented at https://go.dev/doc/install.
go_install_root: /usr/local
go_root: "{{ go_install_root }}/go"
go_bin_path: "{{ go_root }}/bin/go"

# Workspace for `go install` binaries and module cache, owned by the local
# user.  $GOPATH/bin is added to PATH by custom_bash.sh via the env role.
go_path: "{{ home_dir }}/go"

# Ubuntu's golang package is several releases behind and puts a second `go`
# on PATH at /usr/bin/go.  Set to false to keep the distro package alongside
# the upstream install.
go_remove_apt_golang: true

go_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
  armv6l: armv6l
go_arch: "{{ go_arch_map[ansible_facts['architecture']] | default('amd64') }}"
