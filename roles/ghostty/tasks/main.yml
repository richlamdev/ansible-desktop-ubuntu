---
- block:
    - name: update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: install ghostty
      apt:
        name: ghostty
        state: present

    - name: ensure {{ home_dir }}/.config/ghostty directory exists
      file:
        state: directory
        path: "{{ home_dir }}/.config/ghostty"
        owner: "{{ local_user }}"
        group: "{{ local_user_primary_group }}"
        mode: "0770"

    - name: install ghostty config
      copy:
        src: "config.ghostty"
        dest: "{{ home_dir }}/.config/ghostty/config.ghostty"
        owner: "{{ local_user }}"
        group: "{{ local_user_primary_group }}"
        mode: "0640"
        force: true
  tags: ['ghostty']
